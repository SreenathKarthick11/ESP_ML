<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ESP ML API Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f7f9;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            background: #fff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 500px;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
            color: #222;
            text-align: center;
        }

        p {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056c3;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #f0f8ff;
            border-left: 4px solid #007BFF;
            border-radius: 6px;
            font-family: monospace;
            white-space: pre-wrap;
        }

        .download-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            text-decoration: none;
        }

        .download-link button {
            width: auto;
            background-color: #28a745;
        }

        .download-link button:hover {
            background-color: #1e7e34;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ESP ML API Key Registration</h1>
        <p>Register below to generate your API key and download the ESP ML client library. Designed for lightweight IoT ML inference.</p>

        <form id="registerForm">
            <label for="username">Username</label>
            <input type="text" id="username" required placeholder="Enter your username">
            <button type="submit">Register & Get API Key</button>
        </form>

        <div class="result" id="result"></div>

        <a class="download-link" href="/static/esp_ml_client.zip" download>
            <button>Download ESP ML Client ZIP</button>
        </a>
    </div>

    <script>
        const form = document.getElementById("registerForm");
        form.onsubmit = async function (e) {
            e.preventDefault();
            const username = document.getElementById("username").value;
            const response = await fetch("/register_user", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username })
            });
            const data = await response.json();
            const result = document.getElementById("result");

            if (data.api_key) {
                result.innerHTML = `API Key for <strong>${data.username}</strong>:\n${data.api_key}`;
            } else {
                result.innerHTML = `<strong>Error:</strong> ${data.message || data.error}`;
            }
        };
    </script>
</body>
</html>
